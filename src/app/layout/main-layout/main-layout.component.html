<mat-sidenav-container class="layout-container">

      <!-- Sidebar -->
      <mat-sidenav
        #sidenav
        [mode]="isMobile() ? 'over' : 'side'"
        [opened]="!isMobile()"
        class="sidenav">

        <div class="sidenav-header">
          <div class="brand">
            <span class="brand-icon">💰</span>
            <span class="brand-name">Controle Financeiro</span>
          </div>
        </div>

        <nav class="sidenav-nav">
          <mat-nav-list>
            <a
              mat-list-item
              *ngFor="let item of navItems"
              [routerLink]="item.path"
              routerLinkActive="active-link"
              [routerLinkActiveOptions]="{ exact: false }"
              (click)="isMobile() && sidenav.close()">
              <mat-icon matListItemIcon>{{ item.icon }}</mat-icon>
              <span matListItemTitle>{{ item.label }}</span>
            </a>
          </mat-nav-list>
        </nav>

        <div class="sidenav-footer">
          <mat-divider />
          <div class="user-info" [matMenuTriggerFor]="userMenu">
            <div class="user-avatar">
              {{ userInitial() }}
            </div>
            <div class="user-details">
              <span class="user-name">{{ userName() }}</span>
              <span class="user-email">{{ userEmail() }}</span>
            </div>
            <mat-icon class="expand-icon">expand_more</mat-icon>
          </div>

          <mat-menu #userMenu="matMenu">
            <button mat-menu-item routerLink="/settings">
              <mat-icon>settings</mat-icon>
              Configurações
            </button>
            <button mat-menu-item (click)="toggleTheme()">
              <mat-icon>{{ isDark() ? 'light_mode' : 'dark_mode' }}</mat-icon>
              {{ isDark() ? 'Modo claro' : 'Modo escuro' }}
            </button>
            <mat-divider />
            <button mat-menu-item (click)="signOut()" class="logout-btn">
              <mat-icon>logout</mat-icon>
              Sair
            </button>
          </mat-menu>
        </div>
      </mat-sidenav>

      <!-- Main content -->
      <mat-sidenav-content class="main-content">
        <!-- Mobile topbar -->
        <mat-toolbar class="mobile-toolbar" *ngIf="isMobile()">
          <button mat-icon-button (click)="sidenav.toggle()">
            <mat-icon>menu</mat-icon>
          </button>
          <span class="toolbar-title">💰 Controle Financeiro</span>
          <span class="spacer"></span>
          <button mat-icon-button (click)="toggleTheme()" matTooltip="Alternar tema">
            <mat-icon>{{ isDark() ? 'light_mode' : 'dark_mode' }}</mat-icon>
          </button>
        </mat-toolbar>

        <div class="page-content">
          <router-outlet />
        </div>
      </mat-sidenav-content>

    </mat-sidenav-container>
