<div class="form-dialog">
  <div class="dialog-header">
    <div class="header-title">
      <mat-icon>account_balance_wallet</mat-icon>
      <h2>{{ isEdit ? 'Editar conta' : 'Nova conta' }}</h2>
    </div>
    <button mat-icon-button class="close-btn" mat-dialog-close tabindex="-1">
      <mat-icon>close</mat-icon>
    </button>
  </div>

  <mat-dialog-content class="dialog-content">
    <form [formGroup]="form" id="account-form">
      <mat-form-field appearance="outline">
        <mat-label>Nome da Conta *</mat-label>
        <input matInput formControlName="name" placeholder="Ex: Dinheiro Gaveta, Nubank...">
        <mat-error *ngIf="form.get('name')?.hasError('required')">Informe o nome.</mat-error>
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Saldo Inicial *</mat-label>
        <span matPrefix>R$&nbsp;</span>
        <input matInput type="number" formControlName="initial_balance" step="0.01">
        <mat-hint>O saldo que você já tem guardado.</mat-hint>
        <mat-error *ngIf="form.get('initial_balance')?.hasError('required')">Obrigatório.</mat-error>
      </mat-form-field>

      <div class="color-section">
        <label class="color-label">Cor de identificação</label>
        <div class="color-grid">
          <button
            *ngFor="let c of colors"
            type="button"
            class="color-swatch"
            [class.selected]="form.get('color')?.value === c"
            [style.background]="c"
            (click)="selectColor(c)">
          </button>
        </div>
      </div>
    </form>
  </mat-dialog-content>

  <mat-dialog-actions align="end" class="dialog-actions">
    <button mat-button mat-dialog-close>Cancelar</button>
    <button mat-flat-button color="primary" (click)="onSave()" [disabled]="loading()">
      <mat-spinner *ngIf="loading()" diameter="18"></mat-spinner>
      <mat-icon *ngIf="!loading()">save</mat-icon>
      {{ isEdit ? 'Atualizar' : 'Criar' }}
    </button>
  </mat-dialog-actions>
</div>
